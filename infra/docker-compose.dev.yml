# Serviços de desenvolvimento. Segredos vêm do .env gerado por `pnpm setup`.
name: aldetes-dev
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:${REDIS_PORT:-6380}:6379"]
    volumes: [redisdata:/data]

  livekit:
    image: livekit/livekit-server:v1.9.1
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    network_mode: host
    volumes: ["./livekit/livekit.dev.yaml:/etc/livekit.yaml:ro"]
    profiles: ["media"]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
    profiles: ["s3"]

  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    profiles: ["mail"]

volumes:
  pgdata:
  redisdata:
  miniodata:
