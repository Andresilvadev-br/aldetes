# Builds the desktop installers on native runners and publishes them to GitHub Releases.
# Trigger: push a tag like v0.2.0 (or run manually). The download page links to
# .../releases/latest/download/<file>, and the app auto-updates from the same releases.
name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão a publicar (ex.: 0.2.0)'
        required: true
        default: '2.0.0'
      notes:
        description: 'Novidades (aparecem no aviso de atualização; separe os itens com ;)'
        required: false
        default: 'Transmissão em até 120 FPS; Sempre pela placa de vídeo (sem cair para 15 FPS); Quem assiste escolhe Auto, Máxima ou Leve; Botão de diagnóstico da transmissão; Interruptores das configurações consertados'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    env:
      # Installers come pre-configured with the official server (users can still change it).
      ALDETES_DEFAULT_SERVER: https://aldete-chat.duckdns.org
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Set version (from the tag, or from the manual input)
        shell: bash
        working-directory: apps/desktop
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then V="$INPUT_VERSION"; else V="${GITHUB_REF_NAME#v}"; fi
          npm pkg set version="$V"
          echo "ALDETES_VERSION=$V" >> "$GITHUB_ENV"   # the bundled web UI shows the same version
          echo "Versão: $V"
      - name: Build web + main process
        working-directory: apps/desktop
        run: pnpm build
      - name: Release notes (shown in the app's update popup)
        shell: bash
        working-directory: apps/desktop
        env:
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          # one item per line; the app turns them into the list in the popup
          # electron-builder reads build/release-notes.md by default and puts it in the GitHub release
          if [ -n "$NOTES" ]; then printf '%s' "$NOTES" | tr ';' '\n' | sed 's/^ *//; /^$/d; s/^/- /' > build/release-notes.md; fi
      - name: Package and publish
        working-directory: apps/desktop
        run: pnpm exec electron-builder ${{ matrix.target }} --publish always
