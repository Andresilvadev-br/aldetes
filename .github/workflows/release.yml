# Builds the desktop installers on native runners and publishes them to GitHub Releases.
# Trigger: push a tag like v0.2.0 (or run manually). The download page links to
# .../releases/latest/download/<file>, and the app auto-updates from the same releases.
name: Desktop release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    env:
      # Installers come pre-configured with the official server (users can still change it).
      ALDETES_DEFAULT_SERVER: https://aldete-chat.duckdns.org
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: apps/desktop
        run: npm pkg set version="${GITHUB_REF_NAME#v}"
      - name: Build web + main process
        working-directory: apps/desktop
        run: pnpm build
      - name: Package and publish
        working-directory: apps/desktop
        run: pnpm exec electron-builder ${{ matrix.target }} --publish always
